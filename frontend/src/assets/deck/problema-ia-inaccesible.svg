<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#cc0000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc0000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="url(#bg)"/>
  <circle cx="320" cy="170" r="180" fill="url(#glow)"/>
  <!-- Circuitos decorativos llenando el lienzo -->
  <g stroke="#cc0000" stroke-width="1.4" opacity="0.4">
    <path d="M0 60 H90 l20 20 H140 M500 80 H560 l20 -20 H640"/>
    <path d="M0 100 H70 l15 -15 H120 M560 120 H600 l20 -20 H640"/>
    <path d="M0 330 H100 l20 20 H150 M470 340 H540 l20 20 H640"/>
    <path d="M0 365 H80 l15 -15 H130 M520 380 H590 l20 -20 H640"/>
    <circle cx="140" cy="80" r="4" fill="#cc0000" fill-opacity="0.5"/>
    <circle cx="500" cy="120" r="4" fill="#cc0000" fill-opacity="0.5"/>
    <circle cx="150" cy="350" r="4" fill="#cc0000" fill-opacity="0.5"/>
    <circle cx="540" cy="380" r="4" fill="#cc0000" fill-opacity="0.5"/>
  </g>
  <!-- Nube grande de cables -->
  <g stroke="#cc0000" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M170 150 a70 50 0 0 1 140 -40 a60 45 0 0 1 120 20 a70 50 0 0 1 40 85 H160 a60 45 0 0 1 10 -65 Z" stroke="#cc0000" stroke-opacity="0.25"/>
  </g>
  <g stroke="#cc0000" stroke-width="2.5" fill="none">
    <path d="M220 140 h60 M300 120 h50 M360 160 h70 M230 180 h80 M340 195 h60"/>
    <path d="M270 200 v50 M320 200 v55 M370 200 v45" stroke-linecap="round"/>
  </g>
  <!-- Candados colgando de la nube -->
  <g stroke="#cc0000" stroke-width="2.5" fill="none">
    <g transform="translate(235,150)">
      <path d="M0 -20 v-8 a10 10 0 0 1 20 0 v8" stroke-linecap="round"/>
      <rect x="-12" y="-22" width="44" height="30" rx="5" fill="#cc0000" fill-opacity="0.12"/>
      <circle cx="10" cy="-7" r="4" fill="#cc0000"/>
    </g>
    <g transform="translate(320,170)">
      <path d="M0 -20 v-8 a10 10 0 0 1 20 0 v8" stroke-linecap="round"/>
      <rect x="-12" y="-22" width="44" height="30" rx="5" fill="#cc0000" fill-opacity="0.12"/>
      <circle cx="10" cy="-7" r="4" fill="#cc0000"/>
    </g>
    <g transform="translate(405,155)">
      <path d="M0 -20 v-8 a10 10 0 0 1 20 0 v8" stroke-linecap="round"/>
      <rect x="-12" y="-22" width="44" height="30" rx="5" fill="#cc0000" fill-opacity="0.12"/>
      <circle cx="10" cy="-7" r="4" fill="#cc0000"/>
    </g>
  </g>
  <!-- Servidor bloqueado abajo -->
  <g transform="translate(250,245)">
    <rect x="0" y="30" width="140" height="16" rx="4" stroke="#cc0000" stroke-width="2.5" fill="#cc0000" fill-opacity="0.1"/>
    <rect x="10" y="55" width="120" height="16" rx="4" stroke="#cc0000" stroke-width="2.5" fill="#cc0000" fill-opacity="0.1"/>
    <rect x="10" y="80" width="120" height="16" rx="4" stroke="#cc0000" stroke-width="2.5" fill="#cc0000" fill-opacity="0.1"/>
    <circle cx="120" cy="38" r="4" fill="#cc0000" fill-opacity="0.6"/>
